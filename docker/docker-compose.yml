services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: dlms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - dlms_network
    # --- ADD THIS HEALTHCHECK SECTION ---
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dlms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # --- ADD THIS LINE ---
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/dlms_db
    networks:
      - dlms_network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8000
      - AUTH0_DOMAIN=dev-jbg0jvh0nbue44jd.us.auth0.com
      - AUTH0_CLIENT_ID=rMxHInqQgxjuN0IerUmikJ6PnjDGOd18
      - AUTH0_CLIENT_SECRET=Q5ZkzSJj10YoGTJiqnyvCN4YnIiircE8gGz7LvKNNijmlMapDnBjPdmnlHDH-emH
    networks:
      - dlms_network

volumes:
  postgres_data:

networks:
  dlms_network:
    driver: bridge